# HELIOS — reverse proxy (jalon 9 : SSL Let's Encrypt via certbot)
server {
    listen 80;
    server_name helios.example.fr;  # <- domaine à définir

    root /var/www/helios;           # build du front
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Section Guides SUPPRIMÉE le 28/09/2026. Le principe d'Helios est qu'on interroge le
    # robot plutôt que de parcourir des pages : une page qui redit la FAQ n'a pas lieu d'être.
    # La mesure l'avait confirmé — les 43 sections des guides n'apportaient aucun contenu que
    # les fiches n'avaient déjà. Ce qu'ils portaient d'unique (l'ORDRE des décisions) a été
    # versé en fiches dans kb/parcours.md.
    #
    # Les URL étaient indexées : chacune est redirigée vers la fiche la plus proche plutôt que
    # de tomber en 404, ce qui jetterait le référencement acquis. Cibles vérifiées une par une
    # contre les pages pré-rendues.
    location = /guides { return 301 /faq; }
    location = /guides/par-ou-commencer { return 301 /faq/par-ou-commencer-quand-on-veut-renover-et-pourquoi-cet-ordre; }
    location = /guides/apres-le-preaudit { return 301 /faq/je-viens-de-recevoir-mon-pre-audit-helios-que-faire-en-premier; }
    location = /guides/maprimerenov { return 301 /faq/maprimerenov-en-2026-ou-en-est-on; }
    location = /guides/isolation-combles { return 301 /faq/combien-coute-l-isolation-des-combles-perdus; }
    location = /guides/pompe-a-chaleur { return 301 /faq/une-pompe-a-chaleur-comment-ca-marche-et-qu-est-ce-que-le-cop; }
    location = /guides/autoconsommation-solaire { return 301 /faq/autoconsommation-et-autonomie-quelle-difference; }
    location = /guides/bien-acheter-energie { return 301 /faq/qu-est-ce-qu-une-offre-a-tarification-dynamique; }
    location = /guides/locataire-reduire-factures { return 301 /faq/locataire-que-puis-je-faire-pour-reduire-mes-factures; }
    location = /guides/copropriete-travaux-collectifs { return 301 /faq/en-copropriete-comment-lancer-des-travaux-energetiques; }
    location = /guides/comprendre-son-dpe { return 301 /faq/le-dpe-a-quoi-ca-sert-et-est-il-fiable; }
    location = /guides/devis-renovation-pieges { return 301 /faq/quelles-mentions-obligatoires-sur-un-devis-de-renovation; }
    location = /guides/produire-son-eau { return 301 /faq/c-est-quoi-la-production-d-eau-atmospherique-hydrolia; }
    location = /guides/vehicule-electrique-guide { return 301 /faq/puis-je-recharger-ma-voiture-avec-mes-panneaux-solaires; }
    location = /guides/comprendre-autoconso { return 301 /faq/c-est-quoi-le-simulateur-d-autoconsommation-d-helios; }

    # IMPORTANT — `$uri.html` sert les fiches pré-rendues (scripts/prerender.mjs) :
    # /faq/isoler-les-combles  ->  /var/www/helios/faq/isoler-les-combles.html
    #
    # Sans cette directive, la règle SPA renverrait la coquille vide pour toutes les
    # fiches et les 180 pages générées au build seraient invisibles pour les moteurs
    # de recherche. Vérifier après tout changement : le HTML servi doit contenir un <h1>.
    #
    # Le repli final sur index.html garde le fonctionnement de l'application monopage
    # pour toutes les autres routes (simulateurs, espace client, back-office).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
