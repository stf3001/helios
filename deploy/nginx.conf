# HELIOS — reverse proxy (jalon 9 : SSL Let's Encrypt via certbot)
server {
    listen 80;
    server_name helios.example.fr;  # <- domaine à définir

    root /var/www/helios;           # build du front
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # IMPORTANT — `$uri.html` sert les fiches pré-rendues (scripts/prerender.mjs) :
    # /faq/isoler-les-combles  ->  /var/www/helios/faq/isoler-les-combles.html
    #
    # Sans cette directive, la règle SPA renverrait la coquille vide pour toutes les
    # fiches et les 180 pages générées au build seraient invisibles pour les moteurs
    # de recherche. Vérifier après tout changement : le HTML servi doit contenir un <h1>.
    #
    # Le repli final sur index.html garde le fonctionnement de l'application monopage
    # pour toutes les autres routes (simulateurs, espace client, back-office).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
