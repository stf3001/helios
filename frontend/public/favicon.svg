<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     stroke="#A8420F" stroke-width="2" stroke-linecap="round">
  <!-- La marque Helios : le meme soleil au trait que `src/components/MarqueHelios.tsx`.
       Trait epaissi a 2 : a 16 px, 1,5 disparait. -->
  <g>
    <line x1="16" y1="3.2" x2="16" y2="6.8"/>
    <line x1="16" y1="3.2" x2="16" y2="6.8" transform="rotate(45 16 16)"/>
    <line x1="16" y1="3.2" x2="16" y2="6.8" transform="rotate(90 16 16)"/>
    <line x1="16" y1="3.2" x2="16" y2="6.8" transform="rotate(135 16 16)"/>
    <line x1="16" y1="3.2" x2="16" y2="6.8" transform="rotate(180 16 16)"/>
    <line x1="16" y1="3.2" x2="16" y2="6.8" transform="rotate(225 16 16)"/>
    <line x1="16" y1="3.2" x2="16" y2="6.8" transform="rotate(270 16 16)"/>
    <line x1="16" y1="3.2" x2="16" y2="6.8" transform="rotate(315 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="6.6"/>
</svg>
